     sharp at every screen size. Black on transparent, 448.94 x 389.21. -->
<svg xmlns="http://www.w3.org/2000/svg" width="448.94" height="389.21" viewBox="0 0 448.94 389.21">
  <polygon fill="#000000" points="224.47,0 448.94,389.21 224.47,239.36 0,389.21"/>
</svg>
