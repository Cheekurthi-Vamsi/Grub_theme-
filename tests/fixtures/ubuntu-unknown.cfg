}

### END /etc/grub.d/10_linux ###

### BEGIN /etc/grub.d/20_memtest86+ ###
if [ "$grub_platform" = efi -a "$grub_cpu" = x86_64 ]; then
	menuentry "Memory test (mt86+x64)" --class memtest $menuentry_id_option "memtest86+" {
		insmod part_gpt
		insmod ext2
		search --no-floppy --fs-uuid --set=root 1f97a033-564c-48d9-87a0-0b664bc2adad
		linux /mt86+x64
	}
	menuentry "Memory test (mt86+x64, serial console)" --class memtest $menuentry_id_option "memtest86+-serial" {
		insmod part_gpt
		insmod ext2
		search --no-floppy --fs-uuid --set=root 1f97a033-564c-48d9-87a0-0b664bc2adad
		linux /mt86+x64 console=ttyS0,115200
	}
fi
if [ "$grub_platform" = pc ]; then if cpuid -l ; then
	menuentry "Memory test (mt86+x64)" --class memtest $menuentry_id_option "memtest86+" {
		insmod part_gpt
		insmod ext2
		search --no-floppy --fs-uuid --set=root 1f97a033-564c-48d9-87a0-0b664bc2adad
		linux16 /mt86+x64
	}
fi ; fi
### END /etc/grub.d/20_memtest86+ ###

### BEGIN /etc/grub.d/30_os-prober ###
menuentry 'Arch Linux (on /dev/sda2)' --class arch --class gnu-linux --class gnu --class os $menuentry_id_option 'osprober-gnulinux-simple-1111' {
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root 1111
	linux /boot/vmlinuz-linux root=/dev/sda2
	initrd /boot/initramfs-linux.img
}
# This menu entry is supported only on PC BIOS platforms.
if [ "$grub_platform" = "pc" ]; then
menuentry 'Windows 10 (on /dev/sda1)' --class windows --class os $menuentry_id_option 'osprober-chain-2222' {
	insmod part_msdos
	insmod ntfs
	search --no-floppy --fs-uuid --set=root 2222
	parttool ${root} hidden-
	drivemap -s (hd0) ${root}
	chainloader +1
}
fi
### END /etc/grub.d/30_os-prober ###

### BEGIN /etc/grub.d/30_uefi-firmware ###
if [ "$grub_platform" = "efi" ]; then
	fwsetup --is-supported
	if [ "$?" = 0 ]; then
		menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
			fwsetup
		}
	fi
fi
### END /etc/grub.d/30_uefi-firmware ###

### BEGIN /etc/grub.d/35_fwupd ###
menuentry 'Linux Firmware Updater' $menuentry_id_option 'fwupd' {
	insmod part_gpt
	insmod fat
	search --no-floppy --fs-uuid --set=root 63A4-7C42
	chainloader /EFI/ubuntu/fwupdx64.efi
}
### END /etc/grub.d/35_fwupd ###

### BEGIN /etc/grub.d/40_custom ###
menuentry "Reboot" {
	reboot
}
### END /etc/grub.d/40_custom ###
