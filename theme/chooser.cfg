# grub-icon-menu - icon chooser (static file, installed with the theme).
#
# Loaded with `configfile` by the snippet that /etc/grub.d/99_grub_icon_menu
# appends to grub.cfg, so these entries live in their own (nested) menu and
# the standard Ubuntu menu is never modified. Everything dynamic - which
# icons exist, what they boot, which one is preselected - comes from
# variables exported by that snippet and from its gim_entries function.
#
# Keys: Up/Down move the arrow, Enter (or Right) boots, ESC opens the full
# standard menu, `e' edits and `c' opens the GRUB command line.
if [ -n "${gim_dir}" ]; then
  set theme="${gim_dir}/icon-menu.txt"
  set timeout_style=menu
  if [ "${gim_timeout}" = "-1" ]; then
    unset timeout
  else
    set timeout="${gim_timeout}"
  fi
  set default="${gim_selected}"
  gim_entries
fi
